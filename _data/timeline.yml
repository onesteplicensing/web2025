# guide to timeline-template
# 1: one big image and one small image
# 2: for multi images, extraImages are for longer text type logos
# 3: single image (small)
# 4: single image (big & left)
# 5: single image (big & right)
# catch-all: one big images, extraImages are smaller

- year: 2019
  template: timeline-template-1
  active: true
  content:
    - src: /assets/images/timeline/2019-1.svg
      text: "Established"
      extra_src: /assets/images/timeline/2019-2.svg

